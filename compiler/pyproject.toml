[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arachne-loom"
version = "0.0.4"
description = "Deterministic semantic-model to DOCX compiler"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1", "lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loom = "arachne_loom.cli:main"
arachne-loom = "arachne_loom.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
